{% extends "blog/base.html" %}

{% block content %}
<h2>Delete Post</h2>

<p>Are you sure you want to delete this post?</p>

<h3>{{ object.title }}</h3>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<br>
<a href="{% url 'post_detail' object.pk %}">Cancel</a>

{% endblock %}

{% extends "blog/base.html" %}

{% block content %}
<h2>{% if form.instance.pk %}Edit Post{% else %}Create New Post{% endif %}</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<br>
<a href="{% url 'posts' %}">Cancel</a>

{% endblock %}
